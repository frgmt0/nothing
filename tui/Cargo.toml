[package]
name = "nothing-tui"
version.workspace = true
edition.workspace = true

[dependencies]
nothing-core = { path = "../core" }
nothing-action = { path = "../action" }
nothing-eval = { path = "../eval" }
ratatui = "0.30.2"
# Must stay on the version `ratatui` itself re-exports (its default
# `crossterm` feature selects crossterm 0.29), or the `KeyEvent` the pure key
# handler matches on would be a different type from the one the backend
# produces.
crossterm = "0.29.0"

# A demo entry point that opens the embedded factorial fixture with no file
# argument. `nothing edit <file>` in the `cli` crate is the product binary;
# this shim stays for exercising the TUI standalone. Everything it does
# beyond choosing the start-up program lives in the library, where it is
# tested without a terminal.
[[bin]]
name = "nothing-tui-demo"
path = "src/bin/nothing.rs"
